version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      timezone: Canada/Pacific
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
    versioning-strategy: increase-if-necessary
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Canada/Pacific
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
    groups:
      actions:
        patterns:
          - '*'
